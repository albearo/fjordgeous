<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4d7690">
<title>Fjordgeous — Scandinavia 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-top">
    <div>
      <h1 id="trip-title">Fjordgeous 2026</h1>
      <p id="trip-subtitle" class="subtitle">Sweden · Denmark · Norway</p>
    </div>
    <div id="countdown-badge" class="countdown-badge">—</div>
  </div>
</header>

<main id="main-content"></main>

<nav class="tab-bar" id="tab-bar">
  <button class="tab-btn active" data-tab="today">
    <span class="tab-icon-frame"><img class="tab-icon" src="assets/icons/nav-today.png" alt="" /></span><span>Today</span>
  </button>
  <button class="tab-btn" data-tab="itinerary">
    <span class="tab-icon-frame"><img class="tab-icon" src="assets/icons/nav-itinerary.png" alt="" /></span><span>Itinerary</span>
  </button>
  <button class="tab-btn" data-tab="map">
    <span class="tab-icon-frame"><img class="tab-icon" src="assets/icons/nav-map.png" alt="" /></span><span>Map</span>
  </button>
  <button class="tab-btn" data-tab="widgets">
    <span class="tab-icon-frame"><img class="tab-icon" src="assets/icons/nav-widgets.png" alt="" /></span><span>Widgets</span>
  </button>
  <button class="tab-btn" data-tab="info">
    <span class="tab-icon-frame"><img class="tab-icon" src="assets/icons/nav-info.png" alt="" /></span><span>Info</span>
  </button>
</nav>

<div id="toast" class="toast hidden"></div>

<script src="js/crypto-gate.js"></script>
<script src="js/data-loader.js"></script>
<script src="js/currency.js"></script>
<script src="js/live-data.js"></script>
<script src="js/fika.js"></script>
<script src="js/geolocation.js"></script>
<script src="js/word-of-day.js"></script>
<script src="js/app.js"></script>
<script src="js/sw-register.js"></script>
</body>
</html>
